<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { padding: 14px; color: var(--uxp-host-text-color); font: 13px sans-serif; }
    h2 { font-size: 16px; margin: 0 0 12px; }
    .row { display: flex; align-items: center; gap: 10px; }
    input[type=range] { flex: 1; }
    input[type=number] { width: 54px; }
    button { width: 100%; margin-top: 14px; padding: 8px; }
    #status { margin-top: 10px; min-height: 3em; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h2>DLSS Neural Mix</h2>
  <label for="mix">Neural rendering mix</label>
  <div class="row">
    <input id="mix" type="range" min="0" max="100" value="100">
    <input id="mixNumber" type="number" min="0" max="100" value="100" aria-label="Mix percentage">
    <span>%</span>
  </div>
  <button id="process">Process selected layer</button>
  <div id="status" role="status">Select one layer in a Photoshop document.</div>
  <script src="panel.js"></script>
</body>
</html>
